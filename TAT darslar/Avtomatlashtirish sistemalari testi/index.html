<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avtomatlashtirish sistemalari — test tayyorgarlik</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mu:#5f6b7d;--bd:#dde2ea;--ac:#1f6feb;--ok:#1a7f37;--okb:#e6f4ea;--er:#c62828;--erb:#fdecec;--chip:#eef2f8}
@media (prefers-color-scheme:dark){:root{--bg:#11151c;--card:#1a2029;--tx:#e6e9ef;--mu:#9aa5b5;--bd:#2c3542;--ac:#58a6ff;--ok:#4cc26b;--okb:#13301d;--er:#ff6b6b;--erb:#3a1717;--chip:#232b37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
h1{font-size:19px;margin:12px 0 2px}
.sub{color:var(--mu);font-size:13px;margin:0 0 8px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
nav button{border:1px solid var(--bd);background:var(--chip);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:14px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:18px 0 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
.btn{font:inherit;border:0;background:var(--ac);color:#fff;padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.gh{background:var(--chip);color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.45;cursor:default}
.meta{color:var(--mu);font-size:13px}
.tag{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 8px;font-size:12px;color:var(--mu)}
.q{font-size:18px;font-weight:600;margin:8px 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.opt b{min-width:20px}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.er{border-color:var(--er);background:var(--erb)}
.opt.sel{border-color:var(--ac)}
.opt:disabled{cursor:default}
.izoh{border-left:3px solid var(--ac);background:var(--chip);padding:9px 12px;border-radius:6px;font-size:14px;margin-top:6px}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:40px;font-weight:700}
.list .item{border-bottom:1px solid var(--bd);padding:10px 0}
.list .item:last-child{border:0}
.ans{color:var(--ok);font-weight:600}
.hid .ans{filter:blur(6px);cursor:pointer}
ol.lit li{margin-bottom:8px}
a{color:var(--ac)}
.nums{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.nums span{width:30px;height:26px;display:grid;place-items:center;border-radius:5px;font-size:12px;background:var(--chip);cursor:pointer}
.nums span.ok{background:var(--ok);color:#fff}.nums span.er{background:var(--er);color:#fff}.nums span.cur{outline:2px solid var(--ac)}
</style>
</head>
<body>
<header><div class="wrap">
 <h1>Avtomatlashtirish sistemalarini loyihalash, o'rnatish va sozlash</h1>
 <p class="sub">200 ta test savoli · javob variantlari, izohlar va adabiyotlar</p>
 <nav id="nav">
  <button data-v="mashq" class="on">Mashq</button>
  <button data-v="imtihon">Imtihon</button>
  <button data-v="xato">Xatolarim</button>
  <button data-v="royxat">Javoblar ro'yxati</button>
  <button data-v="adab">Adabiyotlar</button>
 </nav>
</div></header>
<main class="wrap" id="app"></main>

<script src="savollar.js"></script>
<script>
const S = window.SAVOLLAR || [];
const L = "ABCD";
const app = document.getElementById("app");
const topics = [...new Set(S.map(s => s.topic))];
const store = {
  get(k, d){ try{ const v = localStorage.getItem("avt_"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("avt_"+k, JSON.stringify(v)); }catch(e){} }
};
let wrong = new Set(store.get("xato", []));
function markWrong(id, isWrong){ isWrong ? wrong.add(id) : wrong.delete(id); store.set("xato", [...wrong]); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
// Variantlarni aralashtirib, savol nusxasini qaytaradi
function mix(s){ const order = shuffle([0,1,2,3]); return {...s, opts: order.map(i=>s.opts[i]), ans: order.indexOf(s.ans)}; }
const topicSelect = (id, val) => `<select id="${id}"><option value="">Barcha mavzular (${S.length})</option>${topics.map(t=>`<option ${t===val?"selected":""}>${esc(t)}</option>`).join("")}</select>`;

// ---------- Savol-savol ishlash (mashq / xatolar / imtihon uchun umumiy) ----------
function runQuiz(list, opts){
  const st = { i:0, picks: Array(list.length).fill(null) };
  const exam = opts.exam;
  const t0 = Date.now();
  function draw(){
    const s = list[st.i], p = st.picks[st.i], done = p !== null;
    const answered = st.picks.filter(x=>x!==null).length;
    const correct = st.picks.filter((x,k)=>x===list[k].ans).length;
    app.innerHTML = `<div class="card">
      <div class="row" style="justify-content:space-between"><span class="meta">${st.i+1} / ${list.length} · №${s.id}</span><span class="tag">${esc(s.topic)}</span></div>
      <div class="bar"><i style="width:${answered/list.length*100}%"></i></div>
      <div class="q">${esc(s.q)}</div>
      ${s.opts.map((o,k)=>{
        let c = "";
        if (done && !exam){ if (k===s.ans) c="ok"; else if (k===p) c="er"; }
        if (done && exam && k===p) c="sel";
        return `<button class="opt ${c}" data-k="${k}" ${done && !exam ? "disabled":""}><b>${L[k]})</b><span>${esc(o)}</span></button>`;
      }).join("")}
      ${done && !exam ? `<div class="izoh">${p===s.ans ? "✅ To'g'ri." : "❌ Noto'g'ri. To'g'ri javob: <b>"+L[s.ans]+"</b>."} ${esc(s.izoh)}</div>` : ""}
      <div class="row" style="justify-content:space-between;margin-top:14px">
        <button class="btn gh" id="prev" ${st.i===0?"disabled":""}>← Oldingi</button>
        <span class="meta">${exam ? `Javob berildi: ${answered}` : `To'g'ri: ${correct} / ${answered}`}</span>
        ${st.i < list.length-1 ? `<button class="btn" id="next">Keyingi →</button>` : `<button class="btn" id="fin">Yakunlash</button>`}
      </div>
      <div class="nums">${list.map((q,k)=>{
        const x = st.picks[k]; let c = k===st.i ? "cur" : "";
        if (x!==null) c += exam ? " sel" : (x===q.ans ? " ok" : " er");
        return `<span class="${c}" data-j="${k}" style="${exam&&x!==null?"background:var(--ac);color:#fff":""}">${k+1}</span>`;
      }).join("")}</div>
    </div>`;
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const k = +b.dataset.k;
      st.picks[st.i] = k;
      if (!exam) markWrong(s.id, k !== s.ans);
      draw();
    });
    app.querySelectorAll(".nums span").forEach(b => b.onclick = () => { st.i = +b.dataset.j; draw(); });
    const g = id => document.getElementById(id);
    g("prev").onclick = () => { st.i--; draw(); };
    if (g("next")) g("next").onclick = () => { st.i++; draw(); };
    if (g("fin")) g("fin").onclick = finish;
  }
  function finish(){
    if (exam && st.picks.includes(null) && !confirm("Ba'zi savollarga javob berilmadi. Yakunlaysizmi?")) return;
    if (exam) list.forEach((s,k)=>markWrong(s.id, st.picks[k] !== s.ans));
    const correct = st.picks.filter((x,k)=>x===list[k].ans).length;
    const pct = Math.round(correct/list.length*100);
    const min = Math.round((Date.now()-t0)/60000);
    const baho = pct>=86 ? "5 (a'lo)" : pct>=71 ? "4 (yaxshi)" : pct>=56 ? "3 (qoniqarli)" : "2 (qoniqarsiz)";
    const bad = list.map((s,k)=>({s,p:st.picks[k]})).filter(x=>x.p!==x.s.ans);
    app.innerHTML = `<div class="card" style="text-align:center">
      <div class="big">${correct} / ${list.length}</div>
      <div>${pct}% · Baho: <b>${baho}</b> · ${min} daqiqa</div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn" id="again">Qaytadan</button>
        ${bad.length ? `<button class="btn gh" id="redo">Xatolarni qayta ishlash (${bad.length})</button>` : ""}
      </div></div>
      ${bad.length ? `<div class="card list"><h3 style="margin-top:0">Xato javoblar</h3>${bad.map(({s,p})=>`
        <div class="item"><div><b>№${s.id}.</b> ${esc(s.q)}</div>
        ${p!==null?`<div style="color:var(--er)">Sizning javobingiz: ${esc(s.opts[p])}</div>`:`<div class="meta">Javob berilmagan</div>`}
        <div class="ans">✔ ${esc(s.opts[s.ans])}</div><div class="meta">${esc(s.izoh)}</div></div>`).join("")}</div>` : ""}`;
    document.getElementById("again").onclick = opts.restart;
    const r = document.getElementById("redo");
    if (r) r.onclick = () => runQuiz(bad.map(x=>mix(x.s)), {exam:false, restart: opts.restart});
  }
  draw();
}

// ---------- Ko'rinishlar ----------
const views = {
  mashq(){
    app.innerHTML = `<div class="card"><h3 style="margin-top:0">Mashq rejimi</h3>
      <p class="meta">Har bir javobdan keyin darhol to'g'ri javob va qisqa izoh ko'rsatiladi. Xato qilgan savollaringiz «Xatolarim» bo'limiga tushadi.</p>
      <div class="row">${topicSelect("t", store.get("mavzu",""))}
      <select id="ord"><option value="tartib">Tartib bo'yicha (1→200)</option><option value="rand">Aralash</option></select>
      <label class="meta">Boshlash №: <input id="from" type="number" min="1" max="200" value="1" style="width:80px"></label>
      <button class="btn" id="go">Boshlash</button></div></div>`;
    document.getElementById("go").onclick = () => {
      const t = document.getElementById("t").value; store.set("mavzu", t);
      const from = Math.max(1, +document.getElementById("from").value || 1);
      let list = S.filter(s => (!t || s.topic===t) && s.id >= from);
      if (document.getElementById("ord").value === "rand") list = shuffle(list);
      if (!list.length) return alert("Savol topilmadi");
      runQuiz(list, {exam:false, restart: views.mashq});
    };
  },
  imtihon(){
    app.innerHTML = `<div class="card"><h3 style="margin-top:0">Imtihon rejimi</h3>
      <p class="meta">Savollar va variantlar tasodifiy aralashtiriladi. To'g'ri javoblar faqat oxirida ko'rsatiladi.</p>
      <div class="row">${topicSelect("t")}
      <select id="n"><option>25</option><option selected>50</option><option>100</option><option>200</option></select>
      <button class="btn" id="go">Imtihonni boshlash</button></div></div>`;
    document.getElementById("go").onclick = () => {
      const t = document.getElementById("t").value, n = +document.getElementById("n").value;
      const list = shuffle(S.filter(s => !t || s.topic===t)).slice(0, n).map(mix);
      runQuiz(list, {exam:true, restart: views.imtihon});
    };
  },
  xato(){
    const list = S.filter(s => wrong.has(s.id));
    app.innerHTML = `<div class="card"><h3 style="margin-top:0">Xatolarim: ${list.length} ta savol</h3>
      <p class="meta">To'g'ri javob bergan savolingiz bu ro'yxatdan avtomatik chiqib ketadi.</p>
      <div class="row"><button class="btn" id="go" ${list.length?"":"disabled"}>Xatolar ustida ishlash</button>
      <button class="btn gh" id="clr" ${list.length?"":"disabled"}>Ro'yxatni tozalash</button></div></div>`;
    document.getElementById("go").onclick = () => runQuiz(shuffle(list).map(mix), {exam:false, restart: views.xato});
    document.getElementById("clr").onclick = () => { if (confirm("Tozalansinmi?")) { wrong.clear(); store.set("xato", []); views.xato(); } };
  },
  royxat(){
    app.innerHTML = `<div class="card"><div class="row">${topicSelect("t")}
      <input id="qs" placeholder="Qidirish..." style="flex:1;min-width:160px">
      <label class="meta"><input type="checkbox" id="hide"> Javoblarni yashirish</label></div></div>
      <div class="card list" id="lst"></div>`;
    const draw = () => {
      const t = document.getElementById("t").value, qs = document.getElementById("qs").value.toLowerCase();
      const box = document.getElementById("lst");
      box.className = "card list" + (document.getElementById("hide").checked ? " hid" : "");
      const list = S.filter(s => (!t || s.topic===t) && (!qs || (s.q+" "+s.opts[s.ans]).toLowerCase().includes(qs)));
      box.innerHTML = list.map(s => `<div class="item"><div><b>${s.id}.</b> ${esc(s.q)} <span class="tag">${esc(s.topic)}</span></div>
        <div class="ans" title="Ko'rish uchun bosing">✔ ${esc(s.opts[s.ans])}</div><div class="meta">${esc(s.izoh)}</div></div>`).join("") || "<p class='meta'>Topilmadi</p>";
      box.querySelectorAll(".ans").forEach(a => a.onclick = () => a.style.filter = "none");
    };
    ["t","qs","hide"].forEach(id => document.getElementById(id).oninput = draw);
    document.getElementById("hide").onchange = draw;
    draw();
  },
  adab(){
    app.innerHTML = `<div class="card"><h3 style="margin-top:0">Tayyorlanish uchun adabiyotlar</h3>
    <h4>Asosiy darslik va qo'llanmalar</h4><ol class="lit">
      <li>Клюев А.С., Глазов Б.В., Дубровский А.Х., Клюев А.А. <i>Проектирование систем автоматизации технологических процессов: справочное пособие.</i> — M.: Энергоатомиздат, 1990. <span class="meta">(Fan bo'yicha asosiy manba: funksional, prinsipial chizmalar, shchitlar, o'tkazishlar.)</span></li>
      <li>Клюев А.С. (red.) <i>Монтаж средств измерений и автоматизации: справочник.</i> — M.: Энергоатомиздат, 1988. <span class="meta">(Impuls trubalari, kabellar, montaj, sozlash.)</span></li>
      <li>Емельянов А.И., Капник О.В. <i>Проектирование систем автоматизации технологических процессов.</i> — M.: Энергоатомиздат, 1983.</li>
      <li>«Avtomatlashtirish sistemalarini loyihalash, o'rnatish va sozlash» — o'quv qo'llanma (kirill yozuvida), BIMM elektron kutubxonasi: <a href="https://lib.bimm.uz/items/download/226" target="_blank" rel="noopener">lib.bimm.uz/items/download/226</a></li>
      <li>Avtomatlashtirish sistemalarining shchit va pultlarini, tarkib va prinsipial sxemalarini loyihalash — referat/slaydlar: <a href="https://arxiv.uz/uz/documents/referatlar/fizika/avtomatlashtirish-sistemalarining-shchit-va-pultlarini-loyi-alash" target="_blank" rel="noopener">arxiv.uz</a></li>
    </ol>
    <h4>Me'yoriy hujjatlar (standartlar)</h4><ol class="lit">
      <li><b>GOST 21.208-2013</b> — SPDS. Asbob va avtomatlashtirish vositalarining sxemalardagi shartli belgilari (savollar 11, 18, 21, 48, 51–52, 60, 74, 82–84, 89, 92, 105, 107, 111, 113, 117, 127, 138, 154, 159, 170, 173, 179, 194, 199).</li>
      <li><b>GOST 21.408-2013</b> — SPDS. Texnologik jarayonlarni avtomatlashtirish ishchi hujjatlarini bajarish qoidalari.</li>
      <li><b>GOST 2.701-2008</b> — ESKD. Sxemalar: turlari va tiplari (E, P, G; 1–7 tiplar).</li>
      <li><b>GOST 2.710-81</b> — ESKD. Elektr sxemalaridagi harfiy-raqamli belgilar (HL, HA, SA, SB, KM, KK, KT, QF, FU).</li>
      <li><b>GOST 2.104</b>, <b>GOST 21.101</b> — asosiy yozuvlar (shtamp), loyiha hujjatlariga asosiy talablar.</li>
      <li><b>GOST 14202-69</b> — quvurlarning tanib olish ranglari (suv — yashil, bug' — qizil, havo — ko'k).</li>
      <li><b>SNiP 3.05.07-85</b> «Avtomatlashtirish tizimlari» (montaj qoidalari) va O'zbekistondagi <b>ShNQ</b> me'yorlari.</li>
      <li><b>PUE</b> — Elektr qurilmalarini o'rnatish qoidalari.</li>
      <li><a href="https://www.normacs.info/discussions/750" target="_blank" rel="noopener">GOST 21.208-2013 haqida (NormaCS)</a></li>
    </ol>
    <h4>AutoCAD</h4><ol class="lit">
      <li>Autodesk AutoCAD rasmiy yordam tizimi (Help, F1): buyruqlar va tezkor tugmalar — LINE, PLINE, CIRCLE (3P, TTR), ARRAY, OFFSET, TRIM, EXPLODE, BLOCK/INSERT, MATCHPROP, LIMITS, UNITS, F3/F8, Ctrl+1.</li>
    </ol>
    <p class="meta">Eslatma: savollar ro'yxati javobsiz berilgani uchun javoblar yuqoridagi standartlar va qo'llanmalar asosida tuzildi. O'qituvchingiz ma'ruzasida boshqacha talqin bo'lsa, o'shanisiga amal qiling.</p></div>`;
  }
};
document.getElementById("nav").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x===b));
  views[b.dataset.v]();
};
if (!S.length) app.innerHTML = "<div class='card'>savollar.js topilmadi. Avval <code>python generatsiya.py</code> ni ishga tushiring.</div>";
else views.mashq();
</script>
</body>
</html>
